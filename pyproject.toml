[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allin1"
dynamic = ["version"]
description = "All-In-One Music Structure Analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["music", "beat", "downbeat", "tracking", "structure", "analysis", "allin1"]
authors = [
  { name = "Taejun Kim", email = "taejun@kaist.ac.kr" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy",
  "librosa",
  "madmom",
  # allin1 uses natten.functional.natten{1,2}d{qkrpb,av}, removed in natten 0.17
  "natten>=0.15,<0.16; platform_system == 'Darwin'",
  "demucs",
  "hydra-core",
  "omegaconf",
  "huggingface_hub",
  "matplotlib",
  # natten 0.15 builds against the installed torch headers. Apple clang 21
  # rejects torch < 2.8 headers (std::is_arithmetic specialization), and
  # torch >= 2.14 headers need C++20 while natten compiles with C++17.
  "torch>=2.8,<2.14; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
train = [
  "lightning",
  "timm",
  "wandb",
  "mir_eval>=0.8",  # <0.8 uses np.int, removed in numpy 1.24
]

[project.urls]
Documentation = "https://github.com/mir-aidj/all-in-one#readme"
Issues = "https://github.com/mir-aidj/all-in-one/issues"
Source = "https://github.com/mir-aidj/all-in-one"

[project.scripts]
allin1 = "allin1.cli:main"
allin1-train = "allin1.training.train:main"
allin1-preprocess = "allin1.training.preprocess:main"

[tool.hatch.version]
path = "src/allin1/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/allin1"]

# natten ships only an sdist and has no static metadata: its setup.py imports
# torch and shells out to cmake (system cmake >= 3.20 must be on PATH).
# Declaring the metadata here lets uv resolve it and build it against the same
# torch that gets installed at runtime.
[[tool.uv.dependency-metadata]]
name = "natten"
version = "0.15.1"
requires-dist = ["packaging", "torch>=2.0.0"]

# PyPI's madmom 0.16.1 predates Python 3.10; only git master builds.
[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom" }

[tool.uv.extra-build-dependencies]
natten = [{ requirement = "torch", match-runtime = true }, "setuptools", "wheel"]
